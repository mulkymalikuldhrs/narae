<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FAF8F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DFE8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DFE8;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#D4C4E0;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4C4A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9B896;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgHero)"/>
  
  <!-- Soft abstract shapes for relaxing vibe -->
  <circle cx="150" cy="200" r="120" fill="#E8DFE8" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="650" cy="150" r="100" fill="#E8DFE8" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="700" cy="600" r="150" fill="#C9B896" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="100" cy="650" r="80" fill="#C9B896" opacity="0.2" filter="url(#softGlow)"/>
  
  <!-- Bathtub outline -->
  <ellipse cx="400" cy="450" rx="200" ry="80" fill="url(#waterGradient)" stroke="#C9B896" stroke-width="2"/>
  <ellipse cx="400" cy="440" rx="180" ry="65" fill="none" stroke="#C9B896" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Water ripples -->
  <ellipse cx="400" cy="440" rx="140" ry="50" fill="none" stroke="#E8DFE8" stroke-width="2" opacity="0.8"/>
  <ellipse cx="400" cy="440" rx="100" ry="35" fill="none" stroke="#E8DFE8" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="400" cy="440" rx="60" ry="20" fill="none" stroke="#E8DFE8" stroke-width="1" opacity="0.4"/>
  
  <!-- Bath salt granules in water -->
  <circle cx="350" cy="430" r="6" fill="#C9B896" opacity="0.6"/>
  <circle cx="420" cy="450" r="8" fill="#E8DFE8" opacity="0.7"/>
  <circle cx="380" cy="460" r="5" fill="#C9B896" opacity="0.5"/>
  <circle cx="450" cy="435" r="7" fill="#E8DFE8" opacity="0.6"/>
  <circle cx="330" cy="445" r="4" fill="#C9B896" opacity="0.5"/>
  <circle cx="470" cy="455" r="6" fill="#E8DFE8" opacity="0.5"/>
  
  <!-- Steam/aroma rising -->
  <path d="M360 380 Q370 350, 360 320 Q350 290, 360 260" fill="none" stroke="#E8DFE8" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M400 380 Q410 340, 400 300 Q390 260, 400 220" fill="none" stroke="#E8DFE8" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <path d="M440 380 Q450 350, 440 320 Q430 290, 440 260" fill="none" stroke="#E8DFE8" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  
  <!-- Small flowers/petals floating -->
  <ellipse cx="320" cy="360" rx="8" ry="12" fill="#E8DFE8" opacity="0.7" transform="rotate(-20 320 360)"/>
  <ellipse cx="480" cy="380" rx="6" ry="10" fill="#C9B896" opacity="0.5" transform="rotate(30 480 380)"/>
  <ellipse cx="370" cy="370" rx="7" ry="11" fill="#C9B896" opacity="0.6" transform="rotate(15 370 370)"/>
  
  <!-- Product container in scene -->
  <rect x="550" y="320" width="100" height="140" rx="4" fill="#FFFFFF" stroke="#C9B896" stroke-width="2" opacity="0.9"/>
  <rect x="570" y="305" width="60" height="15" rx="2" fill="#C9B896"/>
  <text x="600" y="360" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="16" fill="#2D2D2D" opacity="0.8">NARAÈ</text>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="550" r="8" fill="#C9B896" opacity="0.4"/>
  <circle cx="200" cy="530" r="5" fill="#C9B896" opacity="0.3"/>
  <circle cx="170" cy="520" r="6" fill="#E8DFE8" opacity="0.5"/>
  
  <!-- Candles -->
  <rect x="200" y="550" width="12" height="40" fill="#FFFFFF" stroke="#C9B896" stroke-width="1" rx="2"/>
  <ellipse cx="206" cy="550" rx="6" ry="3" fill="#C9B896"/>
  <path d="M206 550 Q206 540, 206 535" fill="none" stroke="#C9B896" stroke-width="2"/>
  <circle cx="206" cy="530" r="3" fill="#FFD700" opacity="0.8"/>
  
  <rect x="230" y="560" width="10" height="30" fill="#FFFFFF" stroke="#C9B896" stroke-width="1" rx="2"/>
  <ellipse cx="235" cy="560" rx="5" ry="2" fill="#C9B896"/>
  
  <!-- Floor/surface -->
  <rect x="0" y="600" width="800" height="200" fill="#F5F0E8" opacity="0.5"/>
  <line x1="0" y1="600" x2="800" y2="600" stroke="#C9B896" stroke-width="1" opacity="0.3"/>
  
  <!-- Brand watermark -->
  <text x="400" y="720" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="48" fill="#2D2D2D" opacity="0.15">NARAÈ</text>
  <text x="400" y="750" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B6B6B" opacity="0.2">Clean Neutral Luxury</text>
</svg>