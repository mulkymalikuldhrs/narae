<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGradientMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE8E0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C9B896" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGradientMed)" rx="12"/>
  
  <!-- BEST SELLER Badge -->
  <rect x="130" y="30" width="140" height="28" rx="14" fill="#C9B896" filter="url(#shadow)"/>
  <text x="200" y="49" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" letter-spacing="1">BEST SELLER</text>
  
  <!-- Product container illustration -->
  <rect x="110" y="100" width="180" height="260" rx="6" fill="#FFFFFF" stroke="#C9B896" stroke-width="2" filter="url(#shadow)"/>
  <rect x="135" y="75" width="130" height="25" rx="3" fill="#C9B896"/>
  
  <!-- Decorative ribbon -->
  <rect x="180" y="120" width="40" height="200" fill="#E8DFE8" opacity="0.5"/>
  
  <!-- Granule texture suggestion -->
  <circle cx="155" cy="180" r="10" fill="#E8DFE8" opacity="0.7"/>
  <circle cx="190" cy="210" r="8" fill="#E8DFE8" opacity="0.7"/>
  <circle cx="225" cy="190" r="12" fill="#E8DFE8" opacity="0.7"/>
  <circle cx="170" cy="240" r="9" fill="#E8DFE8" opacity="0.7"/>
  <circle cx="210" cy="250" r="7" fill="#E8DFE8" opacity="0.7"/>
  <circle cx="245" cy="220" r="11" fill="#E8DFE8" opacity="0.7"/>
  <circle cx="160" cy="280" r="8" fill="#E8DFE8" opacity="0.7"/>
  <circle cx="230" cy="290" r="10" fill="#E8DFE8" opacity="0.7"/>
  
  <!-- Brand text -->
  <text x="200" y="420" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="32" font-weight="600" fill="#2D2D2D">NARAÈ</text>
  <text x="200" y="450" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" fill="#6B6B6B">Medium</text>
  <text x="200" y="475" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#9B8AA0">100g</text>
</svg>