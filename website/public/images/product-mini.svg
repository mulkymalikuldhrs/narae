<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE8E0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="12"/>
  
  <!-- Lavender accent border -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#E8DFE8" stroke-width="2" rx="8"/>
  
  <!-- Product container illustration -->
  <rect x="120" y="80" width="160" height="200" rx="4" fill="#FFFFFF" stroke="#C9B896" stroke-width="1.5"/>
  <rect x="140" y="60" width="120" height="20" rx="2" fill="#C9B896"/>
  
  <!-- Granule texture suggestion -->
  <circle cx="150" cy="150" r="8" fill="#E8DFE8" opacity="0.6"/>
  <circle cx="180" cy="170" r="6" fill="#E8DFE8" opacity="0.6"/>
  <circle cx="210" cy="140" r="10" fill="#E8DFE8" opacity="0.6"/>
  <circle cx="240" cy="160" r="7" fill="#E8DFE8" opacity="0.6"/>
  <circle cx="165" cy="200" r="9" fill="#E8DFE8" opacity="0.6"/>
  <circle cx="225" cy="210" r="5" fill="#E8DFE8" opacity="0.6"/>
  
  <!-- Brand text -->
  <text x="200" y="320" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="28" font-weight="600" fill="#2D2D2D">NARAÈ</text>
  <text x="200" y="348" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#6B6B6B">Mini</text>
  <text x="200" y="368" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#9B8AA0">30g</text>
  
  <!-- Lavender icon -->
  <circle cx="200" cy="50" r="12" fill="#E8DFE8"/>
  <text x="200" y="54" text-anchor="middle" font-family="serif" font-size="14" fill="#9B8AA0">♦</text>
</svg>